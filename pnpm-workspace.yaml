packages:
  - apps/*
  - packages/*

# Supply-chain posture (engineering.md § Toolchain, ADR 0001).
# minimumReleaseAge is pnpm's default (1 day = 1440 minutes); stated explicitly so nobody lowers it by accident.
minimumReleaseAge: 1440

# Lifecycle scripts (preinstall/install/postinstall) of dependencies are blocked by default in pnpm 11.
# Allow-list is deliberately empty; add a package here only with a reason in docs/adr/0010-dependencies.md.
onlyBuiltDependencies: []

strictPeerDependencies: true
saveExact: true

# vite-plus 1.x depends on `vite` as an alias of @voidzero-dev/vite-plus-core, versioned with
# vite-plus (1.4.0, bundling Vite 8.3.5), so its own copy of Vitest 5 sees a `vite` of 1.4.0 against
# peer ranges of ^6.4 || ^7 || ^8 (vitest) and ^6 || ^7 || ^8 (@vitest/mocker), and
# strictPeerDependencies refuses the install. This allows that one version on the `vite` peer of
# vitest 5.0.5 and @vitest/mocker 5.0.5 only; every other peer stays strict, the workspace's own
# Vitest still gets vite 8 from the root, and a Vitest bump drops the allowance. Move the versions
# with vite-plus (docs/adr/0010-dependencies.md, vite-plus row).
peerDependencyRules:
  allowedVersions:
    vitest@5.0.5>vite: 1.4.0
    '@vitest/mocker@5.0.5>vite': 1.4.0
